
# Public endpoints — the trial page and the waiver page have no session,
# so these must NOT require a JWT. Deploying without this (or without
# --no-verify-jwt) makes them return 401 before the function code runs:
# the page shows a generic error and the logs show only boot/shutdown,
# with no application error to go on. Cost an hour on 20 Jul 2026.
[functions.trial-booking]
verify_jwt = false

[functions.waiver-submit]
verify_jwt = false

# Engagement emails (migration 137). Called with a shared secret header, not a
# JWT; the unsubscribe link is clicked from an inbox with no session.
[functions.engagement-emails]
verify_jwt = false

[functions.email-unsubscribe]
verify_jwt = false

# Trial follow-up emails (migration 139). Same shared secret header as
# engagement-emails; no JWT.
[functions.trial-emails]
verify_jwt = false

# MIA emails (migration 140). Same shared secret header as engagement-emails and
# trial-emails; no JWT.
[functions.mia-emails]
verify_jwt = false

# Feedback notification (bug_reports INSERT -> Database Webhook in the dashboard
# -> this function). Called by the webhook without a user JWT; deployed with
# verify_jwt off since v1 (dashboard deploy). Keep it that way.
[functions.notify-feedback]
verify_jwt = false
