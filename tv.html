<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- the screen token is in this page's URL: never send it to fonts or storage -->
<meta name="referrer" content="no-referrer">
<title>myBJJ Gym TV</title>
<!--
  myBJJ gym TV board (Competitions Phase D1, migration 155).
  Standalone: no service worker, no Supabase SDK. Data comes from the tv-show
  Edge Function (GET ?t=TOKEN). The token is read from ?t= once and kept in
  localStorage, so a reload without it still works. The last payload is kept
  too: it paints at once on load and stays on screen through fetch errors.
  The page runs its own 90 s loop following payload.playlist, so it works
  whether AbleSign reloads it each cycle or keeps it open.
  Look: design/tv-prototype-v2.html (approved by Felipe and John).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark;
  /* each gym keeps its own colour on every TV (158) */
  --u-nb:#2b6cff;--u-cd:#d62839;--u-other:#6b7a90;
  /* 174: the app's metal tokens (index.html :root), with its dark-mode edges: the TV is always dark */
  --gold-hi:#FFF8D6;--gold:#FFC928;--gold-mid:#F0A800;--gold-shine:#FFEA8A;--gold-lo:#C68A0A;--silver-hi:#FFFFFF;--silver:#E3E8EE;--silver-mid:#A7B1BD;--silver-shine:#F7F9FB;--silver-lo:#8C96A2;--bronze-hi:#FFE7CC;--bronze:#F2A35A;--bronze-mid:#D9782E;--bronze-shine:#FFC995;--bronze-lo:#B4652A}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;font-family:var(--body)}
/* ================= TV (single dark broadcast look, colors set explicitly) ================= */
.tv{--g1:#0a1f45;--g2:#123a78;--glow:#2f7ff0;--acc:#7fb4ff;--accInk:#0a1f45;
  container-type:inline-size;position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;color:#fff;
  background:#0a1f45;box-shadow:0 0 0 10px #05080f,0 24px 50px rgba(0,0,0,.35);isolation:isolate}
.tv.kids{--g1:#0c2d6b;--g2:#1658b8;--glow:#4aa3ff;--acc:#ffc940;--accInk:#1a1300}
.tv.cup{--g1:#081a3d;--g2:#0f3470;--glow:#2a6fe0;--acc:#f6c453;--accInk:#2a1c00}
.tv.cup.kids{--g1:#0b2a63;--g2:#1552ad;--glow:#4aa3ff;--acc:#f6c453;--accInk:#2a1c00}
.tv *{font-family:var(--body)}
.bg{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(60% 80% at 85% 10%,color-mix(in srgb,var(--glow) 45%,transparent) 0%,transparent 60%),
  radial-gradient(70% 90% at 0% 100%,color-mix(in srgb,var(--g2) 90%,transparent) 0%,transparent 65%),
  linear-gradient(160deg,var(--g2) 0%,var(--g1) 70%)}
.top{position:absolute;left:0;right:0;top:0;height:9.2cqw;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 3.2cqw}
.brand{display:flex;align-items:center;gap:1.1cqw}
.crest{width:3.6cqw;height:3.6cqw;max-width:none;border-radius:50%;filter:drop-shadow(0 .3cqw .8cqw rgba(0,0,0,.35))}
/* festive layer, Cup only */
.snow,.lights,.snowcap{display:none;pointer-events:none}
.tv.cup .snow,.tv.cup .lights,.tv.cup .snowcap{display:block}
.snow{position:absolute;inset:0;width:100%;height:100%}
.lights{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible}
.lights .bulb{animation:tw 2.6s ease-in-out infinite}
.lights .halo{opacity:.35;animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.snowcap{position:absolute;left:0;right:0;top:-1.2cqw;width:100%;height:auto}
.title .t svg.bonbon{width:2.9cqw;height:1.25cqw;stroke:none}
.title .t svg.bonbon:first-child{transform:rotate(-26deg) translateY(-.7cqw)}
.title .t svg.bonbon:last-child{transform:rotate(17deg) translateY(.7cqw)}
.bfo{display:block;width:12cqw;height:1.6cqw;border-radius:.15cqw;box-shadow:0 0 0 .15cqw rgba(255,255,255,.35)}
.unitname{font:600 1.15cqw/1.2 var(--body);letter-spacing:.22cqw;text-transform:uppercase;color:rgba(255,255,255,.72);padding-left:1cqw;border-left:1px solid rgba(255,255,255,.25)}
/* real belts */
.bmini{display:block;width:5.6cqw;height:1.12cqw;border-radius:.12cqw;box-shadow:0 .1cqw .35cqw rgba(0,0,0,.4)}
/* fight for first */
.fo{display:grid;grid-template-rows:1fr auto;gap:1cqw;height:100%}
.arena{position:relative;display:grid;grid-template-columns:1fr 1.2fr 1fr;align-items:center;border-radius:1.4cqw;overflow:hidden;border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(100deg,color-mix(in srgb,var(--lc,#6B7280) 60%,transparent) 0%,color-mix(in srgb,var(--lc,#6B7280) 14%,transparent) 33%,rgba(3,10,26,.45) 50%,color-mix(in srgb,var(--rc,#6B7280) 14%,transparent) 67%,color-mix(in srgb,var(--rc,#6B7280) 60%,transparent) 100%)}
.arena::before{content:"VS";position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);font:900 24cqw/1 var(--display);color:rgba(255,255,255,.05);pointer-events:none}
.ftr{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6cqw;padding:1.2cqw;min-width:0}
.ftr .corner{font:800 1.1cqw var(--display);letter-spacing:.25cqw;padding:.15cqw .9cqw;border-radius:.3cqw;color:var(--fct,#fff);background:var(--fc,#6B7280)}
.ftr .av{box-shadow:0 0 0 .38cqw var(--ring),0 0 3.4cqw color-mix(in srgb,var(--ring) 70%,transparent)}
.ftr .av.bblack{box-shadow:0 0 0 .38cqw var(--ring),0 0 0 .51cqw rgba(255,255,255,.5),0 0 3.4cqw rgba(255,255,255,.25)}
.ftr .fn{font:900 3.8cqw/.9 var(--display);text-transform:uppercase;letter-spacing:.04cqw;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ftr .fn span{display:block;font-weight:700;font-size:1.9cqw;letter-spacing:.2cqw;opacity:.85;margin-bottom:.2cqw}
.scr.on .ftr.red.in{animation-name:inL}
.scr.on .ftr.blue.in{animation-name:inR}
@keyframes inL{from{opacity:0;transform:translateX(-6cqw)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(6cqw)}to{opacity:1;transform:none}}
.tape{position:relative;display:flex;flex-direction:column;padding:1cqw 0}
.tape .hd{text-align:center;font:800 1.2cqw var(--display);letter-spacing:.4cqw;color:rgba(255,255,255,.8);margin-bottom:.5cqw}
.trw{display:grid;grid-template-columns:1fr 9cqw 1fr;align-items:center;gap:.8cqw;border-top:1px solid rgba(255,255,255,.12);padding:.32cqw 0;min-height:2.6cqw}
.trw .l,.trw .r{font:800 2cqw/1 var(--display);font-variant-numeric:tabular-nums;display:flex}
.trw .l{justify-content:flex-end}
.trw .m{font:700 1.02cqw var(--display);letter-spacing:.2cqw;color:rgba(255,255,255,.65);text-align:center}
.trw .win{color:var(--acc)}
.gapline{text-align:center;margin-top:.8cqw}
.gapline b{display:block;font:900 5cqw/1 var(--display);color:var(--acc);font-variant-numeric:tabular-nums}
.gapline span{font:800 1.15cqw var(--display);letter-spacing:.24cqw}
.strip{display:grid;grid-template-columns:1fr 1fr;gap:1cqw}
.strip>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:.9cqw;padding:.7cqw 1.2cqw;font-size:1.35cqw;display:flex;gap:1cqw;align-items:baseline;min-width:0;white-space:nowrap;overflow:hidden}
.strip .k{font:800 1.05cqw var(--display);letter-spacing:.18cqw;color:var(--acc);flex-shrink:0}
.scr>.feed{height:100%;width:78%;margin:0 auto;gap:1cqw}
.scr>.feed .fi{grid-template-columns:4.2cqw 1fr auto;padding:1cqw 1.6cqw}
.scr>.feed .fi .w b{font-size:2.1cqw}
.scr>.feed .fi .w span{font-size:1.5cqw}
.scr>.feed .fi .p{font-size:3.6cqw}
.fo{grid-template-rows:1fr}
.trw{min-height:4cqw}
.trw .l,.trw .r{font-size:3cqw}
.trw .m{font-size:1.2cqw}
.rule .t{font-size:2.1cqw}
.rule{padding:1.1cqw 1.6cqw}
.rule .pts{font-size:3.4cqw}
.card.sum{display:block;width:70cqw}
.card.sum .big{font:900 9cqw/1 var(--display);display:flex;align-items:baseline;gap:1.6cqw;margin:.6cqw 0 1.8cqw;font-variant-numeric:tabular-nums}
.card.sum .big span{font:600 2.3cqw var(--body);color:rgba(255,255,255,.88)}
.card.sum .movers{display:flex;gap:1.2cqw;flex-wrap:wrap}
.card.sum .mvr{display:flex;align-items:center;gap:1cqw;min-width:0}
.card.sum .av{width:3.4cqw;height:3.4cqw}
.card.sum .mvr b{font-size:1.7cqw;font-weight:600}
.card.sum .mvr span{font:800 1.6cqw var(--display);color:#46e08a}
.crestwrap{position:relative;display:inline-flex}
.hat{position:absolute;width:4.6cqw;height:auto;left:-.25cqw;top:-1.8cqw;transform:rotate(-10deg);transform-origin:43% 78%;display:none;filter:drop-shadow(0 .15cqw .3cqw rgba(0,0,0,.45))}
.tv.cup .hat{display:block}
.gapline em{display:block;font:600 1.4cqw var(--body);font-style:normal;color:rgba(255,255,255,.82);margin-top:.6cqw}
/* champion */
.lm .champ{background:radial-gradient(circle at 50% 36%,rgba(246,196,83,.42),transparent 58%),repeating-conic-gradient(from 0deg at 50% 36%,rgba(246,196,83,.09) 0 6deg,transparent 6deg 12deg),linear-gradient(170deg,#1d1606,#0b0a07);color:#fff;border:.22cqw solid #d4a537;gap:.45cqw;padding:1.2cqw}
.lm .champ .crown{width:4.4cqw;height:2.93cqw;margin-bottom:-.6cqw;overflow:visible;filter:drop-shadow(0 0 .8cqw rgba(246,196,83,.8))}
.lm .champ .av.ring{box-shadow:0 0 0 .3cqw var(--ring),0 0 0 .62cqw #f6c453,0 0 4cqw rgba(246,196,83,.65)}
.lm .champ .tag2{font:900 2.8cqw/1 var(--display);letter-spacing:.55cqw;background:linear-gradient(180deg,#fff6d2,#f6c453 55%,#b8862b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lm .champ .mon{font:700 1.15cqw var(--display);letter-spacing:.35cqw;color:#f6c453}
.lm .champ .nm{font:900 3.4cqw/1 var(--display);text-transform:uppercase}
.lm .champ .tbelt{width:26cqw;height:auto;filter:drop-shadow(0 .5cqw 1cqw rgba(0,0,0,.6))}
.lm .champ .n{font:800 1.6cqw var(--display);letter-spacing:.2cqw;color:#f6c453;opacity:1}
.lm .champ .rn{display:flex;gap:2.2cqw;font-size:1.3cqw;font-weight:600;opacity:.9;margin-top:.2cqw}
.lm .champ .rn i{display:inline-block;width:1.1cqw;height:1.1cqw;border-radius:50%;margin-right:.5cqw;vertical-align:-.1cqw}
/* check-in belt */
.card .beltbig{position:relative;width:44cqw;height:4cqw;border-radius:.25cqw;overflow:hidden;box-shadow:0 0 0 .22cqw rgba(255,255,255,.55),0 .9cqw 2.2cqw rgba(0,0,0,.55);clip-path:inset(0 100% 0 0)}
.card .beltbig svg{display:block;width:100%;height:100%}
.flash.on .beltbig{animation:beltIn .8s .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes beltIn{to{clip-path:inset(0 0 0 0)}}
.card .beltbig::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-110%)}
.flash.on .beltbig::after{animation:sheen 1.3s 1.35s ease-in-out}
@keyframes sheen{to{transform:translateX(110%)}}
.card .rankline{font:800 2cqw var(--display);letter-spacing:.28cqw;margin:.9cqw 0 1.4cqw}
@media (prefers-reduced-motion:reduce){.card .beltbig{clip-path:none}.flash.on .beltbig{animation:none}}
.pd .star{width:3.6cqw;height:3.6cqw;filter:drop-shadow(0 0 .9cqw rgba(246,196,83,.85))}
.cd .gift{width:5cqw;height:5cqw;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mark{width:4.3cqw;height:4.3cqw;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:#1A5DAD;font:italic 800 1.9cqw var(--display);box-shadow:inset 0 0 0 .3cqw #1A5DAD,inset 0 0 0 .5cqw #fff,inset 0 0 0 .62cqw #1A5DAD}
.word{font:800 2.8cqw/1 var(--display);letter-spacing:.04cqw}
.unit{font-size:1.2cqw;color:rgba(255,255,255,.7);margin-top:.2cqw}
.title{text-align:center}
.title .t{font:800 3.4cqw/1 var(--display);letter-spacing:.05cqw;display:flex;align-items:center;justify-content:center;gap:.8cqw}
.title .t svg{width:2.8cqw;height:2.8cqw;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.title .s{font-size:1.2cqw;color:rgba(255,255,255,.72);margin-top:.4cqw}
.status{display:flex;justify-content:flex-end;align-items:center;gap:1.6cqw}
.clock{font:700 3.6cqw/1 var(--display);font-variant-numeric:tabular-nums}
.cls{text-align:right}
.cls .a{font:700 1.5cqw/1.1 var(--display)}
.cls .b{font-size:1.15cqw;color:rgba(255,255,255,.72);margin-top:.25cqw;display:flex;align-items:center;gap:.5cqw;justify-content:flex-end}
.live{width:.8cqw;height:.8cqw;border-radius:50%;background:#ff4d5e;box-shadow:0 0 0 0 rgba(255,77,94,.6);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 .9cqw rgba(255,77,94,0)}100%{box-shadow:0 0 0 0 rgba(255,77,94,0)}}

.stage{position:absolute;left:3.2cqw;right:3.2cqw;top:9.6cqw;bottom:11.2cqw}
.scr{position:absolute;inset:0;visibility:hidden}
.scr.on{visibility:visible}
.in{opacity:0;transform:translateY(1.6cqw)}
.scr.on .in{animation:enter .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i,0)*70ms + 120ms)}
@keyframes enter{to{opacity:1;transform:none}}
.scr.out{visibility:visible;animation:leave .45s ease forwards}
@keyframes leave{to{opacity:0;transform:translateX(-2cqw)}}
.dots{position:absolute;right:3.2cqw;bottom:9.4cqw;display:flex;gap:.6cqw}
.dot{width:2.6cqw;height:.32cqw;border-radius:.2cqw;background:rgba(255,255,255,.25);overflow:hidden}
.dot i{display:block;height:100%;width:0;background:#fff}
.dot.done i{width:100%}

/* bottom bar */
.mats{position:absolute;left:0;right:0;bottom:0;height:8.4cqw;display:flex;align-items:center;gap:1.6cqw;padding:0 3.2cqw;background:transparent;border-top:1px solid rgba(255,255,255,.1)}
.mats .lbl{flex-shrink:0;display:flex;align-items:center;gap:1cqw}
.mats .lbl .n{order:-1;align-items:center}
.mats .lbl .k{line-height:1}
.mats .lbl .k{font:700 1.15cqw var(--display);letter-spacing:.14cqw;color:rgba(255,255,255,.72)}
.mats .lbl .n{font:900 3.4cqw/1 var(--display);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:.8cqw}
.mats .lbl .n small{font:600 1.15cqw var(--body);color:rgba(255,255,255,.65);order:2}
.empty{font-size:1.35cqw;color:rgba(255,255,255,.6)}

/* avatars */
.av{border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:linear-gradient(150deg,#c2cee0,#7f93b0)}
.av svg{width:72%;height:72%;margin-top:22%}
.av.ini{background:linear-gradient(150deg,#3d7fd6,#1A5DAD);font-family:var(--display);font-weight:800;color:#fff}
.av{--ring:#6B7280;box-shadow:0 0 0 .17cqw var(--ring)}
.av.ring{box-shadow:0 0 0 .3cqw var(--ring),0 .6cqw 1.6cqw rgba(0,0,0,.3)}
/* black belt on the dark TV: a thin light outline outside the ring */
.av.bblack{box-shadow:0 0 0 .17cqw var(--ring),0 0 0 .3cqw rgba(255,255,255,.5)}
.av.ring.bblack{box-shadow:0 0 0 .3cqw var(--ring),0 0 0 .43cqw rgba(255,255,255,.5),0 .6cqw 1.6cqw rgba(0,0,0,.3)}

/* tags */
.tag{display:inline-block;font:800 1cqw/1.5 var(--display);letter-spacing:.16cqw;border-radius:.4cqw;padding:0 .6cqw;white-space:nowrap;flex-shrink:0}
.tag.lead{background:var(--acc);color:var(--accInk)}
.tag.staff{background:rgba(255,255,255,.2);color:#fff}
.tag.prize{background:var(--acc);color:var(--accInk)}
.row.hot .tag.staff{background:rgba(10,31,69,.14);color:#0a1f45}

/* race */
.race{display:grid;grid-template-columns:47% 1fr;gap:2.6cqw;height:100%}
.podium{display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:1cqw;height:100%}
.pd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pd .who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.4cqw;margin-bottom:.9cqw}
.pd .nm{font-weight:600;font-size:1.45cqw;line-height:1.1;max-width:100%}
.pd .blk{flex-shrink:0;width:100%;border-radius:1.2cqw 1.2cqw .4cqw .4cqw;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1cqw;transform-origin:bottom;border:1px solid rgba(255,255,255,.12)}
.scr.on .pd .blk{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.pd.p1 .blk{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--g2)));color:var(--accInk);border-color:transparent}
.pd .n{font:900 3.8cqw/1 var(--display);font-variant-numeric:tabular-nums}
.pd .u{font:700 1.1cqw var(--display);letter-spacing:.14cqw;opacity:.75}
.pd .pl{font:700 1.25cqw var(--display);letter-spacing:.14cqw;opacity:.85;margin-top:.4cqw}
@keyframes grow{from{transform:scaleY(.15);opacity:.2}to{transform:none;opacity:1}}
.list{display:flex;flex-direction:column;gap:.5cqw;justify-content:center;height:100%;position:relative}
.row{display:grid;grid-template-columns:2.4cqw 2.8cqw 1fr 5.2cqw;align-items:center;gap:1cqw;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:.9cqw;padding:.5cqw 1.1cqw;font-size:1.55cqw;will-change:transform}
.row .pos{font:800 1.8cqw var(--display);opacity:.75;text-align:center;font-variant-numeric:tabular-nums}
.row .nm{display:flex;align-items:center;gap:.7cqw;min-width:0;font-weight:500}
.row .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .belt{width:3.2cqw;height:.75cqw;border-radius:.4cqw}
.row .n{font:900 2.2cqw var(--display);text-align:right;font-variant-numeric:tabular-nums}
.row.hot{background:#fff;color:#0a1f45;border-color:#fff;box-shadow:0 .5cqw 1.6cqw rgba(0,0,0,.25)}
.row .mv{font:800 1.15cqw var(--display);color:#46e08a;flex-shrink:0}
/* 174: staff are on the board without a place */
.row.staff>*,.pd.staff .who>*{opacity:.5}
.row.hot .mv{color:#0e8f47}
.gap{display:flex;align-items:center;gap:1cqw;padding:0 1.1cqw;font-size:1.1cqw;color:rgba(255,255,255,.45);height:1.4cqw}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed rgba(255,255,255,.2)}

/* gi / no-gi */
.two{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;height:100%}
.col{display:flex;flex-direction:column;gap:.55cqw;justify-content:center;min-width:0}
.col h3{margin:0 0 .6cqw;font:800 2.6cqw var(--display);letter-spacing:.1cqw;display:flex;align-items:baseline;gap:1cqw}
.col h3 small{font:600 1.2cqw var(--body);opacity:.7;letter-spacing:0}
.col .row.first{background:linear-gradient(90deg,color-mix(in srgb,var(--glow) 70%,transparent),rgba(255,255,255,.08))}

/* chase */
.chase{display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr;gap:1.4cqw;height:100%}
.tile{border-radius:1.4cqw;padding:2cqw 2.2cqw;display:flex;flex-direction:column;justify-content:center;gap:.8cqw;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);min-width:0}
.tile.big{grid-row:1 / span 2;background:linear-gradient(160deg,color-mix(in srgb,var(--glow) 55%,transparent),rgba(255,255,255,.04))}
.tile .k{font:700 1.3cqw var(--display);letter-spacing:.14cqw;color:rgba(255,255,255,.75)}
.tile .v{font-size:2cqw;font-weight:600;line-height:1.25}
.tile .v b{font:900 3.6cqw/1 var(--display);vertical-align:-.2cqw;color:var(--acc)}
.tile .fine{font-size:1.25cqw;color:rgba(255,255,255,.7);font-weight:500}
.places{display:grid;gap:.45cqw}
.places div{display:flex;align-items:center;gap:1cqw;font-size:1.7cqw;font-weight:600}
.places span{font:800 1.4cqw var(--display);letter-spacing:.1cqw;color:var(--acc);width:3.4cqw}
.duel{display:flex;align-items:center;gap:1.6cqw;margin-top:.6cqw}
.duel .p{display:flex;flex-direction:column;align-items:center;gap:.5cqw;text-align:center;min-width:0}
.duel .p .nm{font-weight:600;font-size:1.5cqw}
.duel .p .n{font:900 3.4cqw/1 var(--display);font-variant-numeric:tabular-nums}
.duel .mid{flex:1;text-align:center}
.duel .mid .n{font:900 6cqw/1 var(--display);color:var(--acc);font-variant-numeric:tabular-nums}
.duel .mid .k{margin-top:.3cqw}

/* latest points */
.feedwrap{display:grid;grid-template-columns:1.55fr 1fr;gap:2.4cqw;height:100%}
.feed{display:flex;flex-direction:column;gap:.7cqw;justify-content:center;min-width:0}
.fi{display:grid;grid-template-columns:3.6cqw 1fr auto;gap:1.3cqw;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);border-radius:1cqw;padding:.8cqw 1.3cqw}
.fi .w{min-width:0}
.fi .w b{display:block;font-weight:600;font-size:1.65cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .w span{display:block;font-size:1.3cqw;color:rgba(255,255,255,.72);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi .p{font:900 2.8cqw var(--display);color:var(--acc);font-variant-numeric:tabular-nums;text-align:right}
.fi .p small{display:block;font:600 1.05cqw var(--body);color:rgba(255,255,255,.6);text-align:right}
.week{display:grid;grid-template-rows:auto repeat(4,1fr);gap:.8cqw}
.week .k{font:700 1.3cqw var(--display);letter-spacing:.14cqw;color:rgba(255,255,255,.75);align-self:end}
.wk{display:flex;align-items:center;justify-content:space-between;gap:1cqw;border-radius:1cqw;background:rgba(255,255,255,.06);padding:0 1.6cqw;font-size:1.5cqw;font-weight:500}
.wk b{font:900 3cqw var(--display);font-variant-numeric:tabular-nums}

/* battle */
.battle{display:flex;flex-direction:column;justify-content:center;gap:2.2cqw;height:100%;padding:0 1cqw}
.sides{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:2cqw}
.side .un{font:800 2.2cqw var(--display);letter-spacing:.18cqw}
.side .avg{font:900 10cqw/.95 var(--display);font-variant-numeric:tabular-nums}
.side .per{font:700 1.3cqw var(--display);letter-spacing:.14cqw;color:rgba(255,255,255,.75)}
.side .sub{font-size:1.4cqw;color:rgba(255,255,255,.7);margin-top:.4cqw}
.side.r{text-align:right}
.side.win .avg{color:var(--acc)}
.vs{font:900 3.4cqw var(--display);opacity:.5;padding-bottom:3cqw}
.track{height:2.2cqw;border-radius:1.1cqw;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#fff,var(--acc));border-radius:1.1cqw;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.track::after{content:"";position:absolute;left:50%;top:-.4cqw;bottom:-.4cqw;width:.2cqw;background:rgba(255,255,255,.6)}
.fair{display:flex;justify-content:space-between;align-items:baseline;gap:2cqw;font-size:1.45cqw;color:rgba(255,255,255,.85)}
.fair b{font:800 2.2cqw var(--display);color:#fff}

/* last month */
.lm{display:grid;grid-template-columns:44% 1fr;gap:2.6cqw;height:100%}
.champ{position:relative;border-radius:1.6cqw;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;text-align:center;padding:1.6cqw;
  background:linear-gradient(170deg,var(--acc),color-mix(in srgb,var(--acc) 45%,var(--g1)));color:var(--accInk)}
.champ .tag2{font:900 1.5cqw var(--display);letter-spacing:.4cqw}
.champ .nm{font:900 3.6cqw/1 var(--display)}
.champ .n{font-size:1.6cqw;font-weight:600;opacity:.85}
.champ .rn{display:flex;gap:2.4cqw;margin-top:.8cqw;font-size:1.35cqw;font-weight:600;opacity:.85}
.champ>.shine{position:absolute;inset:-50%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.45) 50%,transparent 60%);transform:translateX(-60%)}
.scr.on .champ>.shine{animation:shine 3.2s 1s ease-in-out}
@keyframes shine{to{transform:translateX(60%)}}
.hl{display:flex;flex-direction:column;gap:1.1cqw;justify-content:center;min-width:0}
.hl .it{display:flex;align-items:center;gap:1.4cqw;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:1.2cqw;padding:1.2cqw 1.6cqw}
.hl .k{font:700 1.2cqw var(--display);letter-spacing:.14cqw;color:rgba(255,255,255,.75)}
.hl .nm{font-weight:600;font-size:1.8cqw}
.hl .v{margin-left:auto;font:800 2cqw var(--display);color:var(--acc);white-space:nowrap}

/* how to score */
.howto{display:grid;grid-template-columns:1.55fr 1fr;gap:2.4cqw;height:100%}
.rl{display:flex;flex-direction:column;gap:.8cqw;justify-content:center;min-width:0}
.rule{display:grid;grid-template-columns:4.4cqw 1fr auto;gap:1.4cqw;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:1.1cqw;padding:.9cqw 1.4cqw}
.rule .ic{width:4.4cqw;height:4.4cqw;border-radius:1cqw;background:color-mix(in srgb,var(--acc) 22%,transparent);display:flex;align-items:center;justify-content:center}
.rule svg{width:2.4cqw;height:2.4cqw;stroke:var(--acc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rule .t{font-size:1.75cqw;font-weight:600;line-height:1.15}
.rule .d{font-size:1.2cqw;color:rgba(255,255,255,.7);margin-top:.2cqw}
.rule .pts{font:900 3cqw/1 var(--display);color:var(--acc);text-align:right;font-variant-numeric:tabular-nums}
.rule .pts small{display:block;font:700 1cqw var(--display);letter-spacing:.14cqw;color:rgba(255,255,255,.6)}
/* 6 or more rules: one line each (title, then the description clipped to one line), so the
   whole catalog fits above the bar at any 16:9 size. Five or fewer: the layout above. */
.howto.compact .rl{gap:.55cqw}
.howto.compact .rule{grid-template-columns:3.2cqw minmax(0,1fr) auto;gap:1.1cqw;padding:.55cqw 1.2cqw;border-radius:.9cqw}
.howto.compact .rule .ic{width:3.2cqw;height:3.2cqw;border-radius:.8cqw}
.howto.compact .rule svg{width:1.9cqw;height:1.9cqw}
.howto.compact .rule>div:nth-child(2){min-width:0}
.howto.compact .rule .t{font-size:1.6cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.howto.compact .rule .d{font-size:1.2cqw;line-height:1.3;margin-top:.1cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.howto.compact .rule .pts{font-size:2.5cqw}
.cd{border-radius:1.6cqw;padding:2.2cqw;display:flex;flex-direction:column;justify-content:center;gap:1cqw;background:linear-gradient(165deg,color-mix(in srgb,var(--acc) 30%,var(--g2)),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14)}
.cd .big{font:900 9cqw/.9 var(--display);color:var(--acc);font-variant-numeric:tabular-nums}
.cd .k{font:800 1.5cqw var(--display);letter-spacing:.2cqw}
.cd p{margin:0;font-size:1.45cqw;line-height:1.35;color:rgba(255,255,255,.88)}
.cd p.fine{font-size:1.2cqw;color:rgba(255,255,255,.65)}

/* overlays */
.flash{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;pointer-events:none;visibility:hidden}
.flash.on{visibility:visible}
.sweep{position:absolute;inset:0;background:linear-gradient(110deg,var(--belt,#2f7ff0) 0%,color-mix(in srgb,var(--belt,#2f7ff0) 50%,#0a1f45) 55%,#0a1f45 100%);transform:translateX(-100%)}
.flash.on .sweep{animation:sweepIn .55s cubic-bezier(.7,0,.2,1) forwards}
.flash.off .sweep{animation:sweepOut .55s cubic-bezier(.7,0,.2,1) forwards}
@keyframes sweepIn{to{transform:none}}
@keyframes sweepOut{from{transform:none}to{transform:translateX(100%)}}
.card{position:relative;display:grid;grid-template-columns:auto 1fr;gap:3.2cqw;align-items:center;width:78cqw;opacity:0}
.flash.on .card{animation:cardIn .6s .35s cubic-bezier(.2,.9,.3,1.2) forwards}
.flash.off .card{animation:cardOut .4s ease forwards}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(2cqw)}to{opacity:1;transform:none}}
@keyframes cardOut{from{opacity:1}to{opacity:0;transform:translateY(8cqw) scale(.6)}}
.card .av{width:22cqw;height:22cqw}
.card .k{font:800 1.6cqw var(--display);letter-spacing:.4cqw;color:rgba(255,255,255,.85)}
.card .nm{font:900 7cqw/.95 var(--display);margin:.5cqw 0 1.4cqw}
.card .beltbar{height:1.1cqw;width:22cqw;border-radius:.6cqw;margin-bottom:1.6cqw;box-shadow:inset 0 0 0 .12cqw rgba(0,0,0,.15)}
.stats{display:flex;gap:1.2cqw;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:1cqw;padding:.9cqw 1.4cqw;min-width:13cqw;opacity:0;transform:translateY(1cqw)}
.flash.on .stat{animation:enter .55s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*140ms + 650ms)}
.stat .v{font:900 3.2cqw/1 var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:1.25cqw;color:rgba(255,255,255,.85);margin-top:.3cqw}
.stat.acc{background:var(--acc);color:var(--accInk);border-color:transparent}
.stat.acc .l{color:inherit;opacity:.8}
.card .hint{margin-top:1.2cqw;font-size:1.3cqw;color:rgba(255,255,255,.75)}
.toast{position:absolute;left:50%;top:10.4cqw;z-index:6;transform:translate(-50%,-1cqw);opacity:0;transition:opacity .35s,transform .35s;background:#fff;color:#0a1f45;border-radius:999px;padding:.8cqw 2.2cqw;font:600 1.5cqw var(--body);white-space:nowrap;box-shadow:0 .6cqw 2cqw rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast b{font-weight:700}

@media (prefers-reduced-motion:reduce){
  .live{animation:none}
  .scr.on .in,.scr.on .pd .blk,.flash.on .stat,.flash.on .card{animation:none;opacity:1;transform:none}
  .flash.on .sweep{animation:none;transform:none}
  .scr.out{animation:none;visibility:hidden}
}
/* ---- tv.html: full screen 16:9 (1920x1080, 1280x720, letterboxed otherwise) ---- */
.tv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 16 / 9));max-width:none;border-radius:0;box-shadow:none}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;margin:0}
.boot{position:absolute;inset:0;z-index:4;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2cqw}
.boot.on{display:flex}
.boot img{width:14cqw;height:14cqw;border-radius:50%;filter:drop-shadow(0 .6cqw 1.6cqw rgba(0,0,0,.4))}
.boot .bt{font:800 3.2cqw/1 var(--display);letter-spacing:.06cqw}
.boot .bu{font:600 1.4cqw var(--body);letter-spacing:.3cqw;text-transform:uppercase;color:rgba(255,255,255,.72)}
.tv.booting .top,.tv.booting .stage,.tv.booting .dots,.tv.booting .mats{visibility:hidden}
.emptyboard{grid-column:1 / -1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1cqw;height:100%;text-align:center}
.emptyboard b{font:900 5cqw/1 var(--display)}
.emptyboard span{font-size:1.6cqw;color:rgba(255,255,255,.75)}
.bt2{display:flex;flex-direction:column;justify-content:center;gap:2.4cqw;height:100%;padding:0 1cqw}
.bt2 .blk2{display:flex;flex-direction:column;gap:.9cqw}
.bt2 .hd2{font:800 1.5cqw var(--display);letter-spacing:.3cqw;color:rgba(255,255,255,.75)}
.bt2 .sides{align-items:end}
.bt2 .side .avg{font-size:6.4cqw}
.bt2 .side .un{font-size:1.9cqw}
.bt2 .vs{font-size:2.4cqw;padding-bottom:1.6cqw}
.bt2 .track{height:1.6cqw}
.bt2 .fair{font-size:1.3cqw}
.bt2 .fair b{font-size:1.8cqw}
.cls[hidden]{display:none}
/* 161: the Cup is over (in numbers) and the Cup champions (prototype v3) */
.wrapup{display:grid;grid-template-rows:1fr auto;gap:1.8cqw;height:100%}
.wnums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.4cqw}
.wn{border-radius:1.4cqw;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:2cqw;display:flex;flex-direction:column;justify-content:center;gap:.8cqw;min-width:0}
.wn b{font:900 6.4cqw/1 var(--display);color:var(--acc);font-variant-numeric:tabular-nums}
.wn>span{font:700 1.3cqw var(--display);letter-spacing:.16cqw;color:rgba(255,255,255,.8)}
.wmsg{border-radius:1.4cqw;padding:1.6cqw 2.2cqw;display:flex;align-items:center;gap:2cqw;background:linear-gradient(100deg,color-mix(in srgb,var(--acc) 26%,var(--g2)),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14)}
.wmsg b{display:block;font:800 2.4cqw/1.1 var(--display);letter-spacing:.04cqw}
.wmsg span{display:block;font-size:1.45cqw;color:rgba(255,255,255,.85);margin-top:.3cqw}
.wmsg .gift{width:4.4cqw;height:4.4cqw;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lm .champ .nm.anon{opacity:.8}
/* 158: Up next (prototype v3 "tonight's class") */
.roster{display:grid;grid-template-rows:auto 1fr;gap:1.6cqw;height:100%}
.rhead{display:flex;align-items:center;gap:2.2cqw;min-height:5.4cqw}
.rh{display:flex;align-items:baseline;gap:1cqw}
.rh b{font:900 5.4cqw/1 var(--display);font-variant-numeric:tabular-nums}
.rh b.dim{color:rgba(255,255,255,.55)}
.rh span{font:800 1.3cqw var(--display);letter-spacing:.2cqw;color:rgba(255,255,255,.78)}
.rsep{width:1px;height:4cqw;background:rgba(255,255,255,.2)}
.rcls{margin-left:auto;text-align:right;min-width:0}
.rcls span{font-size:1.5cqw;color:rgba(255,255,255,.8)}
.rgrid{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:.9cqw;align-content:start}
.rp{display:flex;align-items:center;gap:.9cqw;padding:.6cqw .9cqw;border-radius:.9cqw;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);min-width:0}
.rp .tx{min-width:0;flex:1}
.rp b{display:block;font-weight:600;font-size:1.4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp .bm{display:block;width:5.2cqw;height:.9cqw;margin-top:.4cqw;border-radius:.1cqw}
.rp.exp{background:transparent;border-style:dashed;opacity:.5}
.rp.more{justify-content:center;font:800 1.6cqw var(--display);letter-spacing:.1cqw;background:transparent}
.rav{position:relative;flex-shrink:0}
.ck{position:absolute;right:-.3cqw;bottom:-.3cqw;width:1.5cqw;height:1.5cqw;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 .2cqw var(--g1)}
.ck::after{content:"";position:absolute;left:.5cqw;top:.26cqw;width:.4cqw;height:.75cqw;border:solid #fff;border-width:0 .2cqw .2cqw 0;transform:rotate(45deg)}
.roster .empty{grid-column:1 / -1;font-size:2cqw}
.rgrid.lg{gap:1.2cqw}
.rgrid.lg .rp{padding:1cqw 1.3cqw;gap:1.3cqw;border-radius:1.1cqw}
.rgrid.lg .rp b{font-size:1.95cqw}
.rgrid.lg .rp .bm{width:7.2cqw;height:1.25cqw;margin-top:.5cqw}
.rgrid.lg .ck{width:1.9cqw;height:1.9cqw}
.rgrid.lg .ck::after{left:.66cqw;top:.36cqw;width:.5cqw;height:.95cqw}
/* 158: the bottom bar is one calm line; the names live on Up next */
.mats{gap:1.4cqw}
.mats .lbl .k{font:800 1.2cqw/1 var(--display);letter-spacing:.22cqw;color:var(--acc)}
.mline{display:flex;align-items:baseline;gap:2.4cqw;font-size:1.5cqw;color:rgba(255,255,255,.82);flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.mline .cnt2 b{font:800 2.6cqw/1 var(--display);color:#fff;margin-right:.6cqw;font-variant-numeric:tabular-nums}
/* 158: the progress dots sit in the bottom bar, bottom right */
.dots{bottom:3.9cqw;z-index:2}
/* 158: battle badges and the bar in each gym's colour */
.side .un{display:flex;align-items:center;gap:1.1cqw;font:900 2.8cqw/1 var(--display);letter-spacing:.14cqw}
.side.r .un{justify-content:flex-end}
.badge{width:4.4cqw;height:4.4cqw;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font:900 1.8cqw/1 var(--display);letter-spacing:.04cqw;color:#fff;box-shadow:0 0 0 .3cqw rgba(255,255,255,.9),0 .6cqw 1.6cqw rgba(0,0,0,.35)}
.bt2 .side .un{font-size:2.2cqw}
.bt2 .badge{width:3.4cqw;height:3.4cqw;font-size:1.4cqw}
.bt2 .track{background:var(--away)}
.bt2 .track i{background:var(--home)}
.bt2 .track::after{display:none}
/* 158: belts next to names */
.rbelt{display:block;width:4.4cqw;height:.9cqw;border-radius:.08cqw;flex-shrink:0}
.fbelt{display:block;width:5.4cqw;height:.95cqw;border-radius:.08cqw;margin:.35cqw 0 .3cqw}
.ibelt{display:block;width:6.4cqw;height:1.05cqw;border-radius:.08cqw;margin-top:.4cqw}
.cbelt{display:block;width:13cqw;height:1.7cqw;border-radius:.12cqw}
.mbelt{display:inline-block;vertical-align:middle;width:3.6cqw;height:.75cqw;border-radius:.08cqw;margin-left:.6cqw}
/* 156: race rows and podium carry the belt (same drawing as the chase screen) */
.row.wb{grid-template-columns:2.4cqw 2.8cqw 1fr 5.6cqw 5.2cqw}
.row .belt{display:block;width:5.6cqw;height:1.12cqw;border-radius:.12cqw;box-shadow:0 .1cqw .35cqw rgba(0,0,0,.4)}
.pd .who .bmini{margin-top:.15cqw}
.av.ini{text-transform:uppercase}
</style>

<body>
<div class="tv booting" id="tv">
  <div class="bg"></div>
  <canvas class="snow" id="snow" aria-hidden="true"></canvas>

function beltSVG(belt,deg,L,cls){
  const parts=String(belt||'white').toLowerCase().split(/[\/\- ]+/).filter(Boolean),base=parts[0]||'white',mid=parts[1],c=BC[base]||'#888',id='bg'+(++bid),black=base==='black';

  const n=Math.max(0,Math.min(Number(deg)||0,black?6:4)),sw=L>300?10:8,gp=L>300?8:5;

  const sc=light?'rgba(0,0,0,.2)':'rgba(255,255,255,.14)';
  let st='';for(let i=0;i<n;i++){const x=bx+barW-12-(i+1)*sw-i*gp;st+=`<rect x="${x}" y="0" width="${sw}" height="40" fill="#f6f3ec"/><rect x="${x+sw-1.5}" y="0" width="1.5" height="40" fill="#000" opacity=".18"/>`;}

function countUp(root){if(RM)return;root.querySelectorAll('.cnt').forEach(el=>{const to=+el.dataset.to;const from=Math.max(0,to-Math.max(3,to*.6));const t0=performance.now(),d=900;

  const f=()=>{const k=Math.min(1,Math.max(0,(performance.now()-t0)/d)),e=1-Math.pow(1-k,3);el.textContent=k<1?String(Math.round(from+(to-from)*e)):fmt(to);if(k<1)requestAnimationFrame(f);};
  el.textContent=String(Math.round(from));requestAnimationFrame(f);setTimeout(()=>{el.textContent=fmt(to);},d+200);});}

function usable(pl){

    const s=x&&x.screen,sec=Math.max(0,Number(x&&x.seconds)||0);
    let ok=!!SCR[s];if(ok){try{ok=!!SCR[s]();}catch(_){ok=false;}}
    if(ok)out.push({screen:s,seconds:sec});else spare+=sec;
  });

// 160: at most 4 screens per 90 s show (about 22 s each). Up next and the races
// always; the other screens take turns from one show to the next. The show
// counter lives in localStorage (one more on each page load and each time this
// loop wraps), so an AbleSign reload moves on to the next slice too.
const PER_SHOW=4,LS_SHOW='mybjj_tv_show';
let showN=0;
function bumpShow(){
  try{let n=parseInt(lsGet(LS_SHOW)||'0',10);if(!isFinite(n)||n<0)n=0;n++;localStorage.setItem(LS_SHOW,String(n));showN=n;}
  catch(_){showN=Math.floor(Date.now()/60000);}
}
function pickShow(all){
  const pinned=x=>/^up_next_/.test(x.screen)||/^race_/.test(x.screen);
  const pin=all.filter(pinned),rest=all.filter(x=>!pinned(x));
  const n=Math.max(0,PER_SHOW-pin.length),out=pin.slice(),k=Math.min(n,rest.length);
  for(let i=0;i<k;i++)out.push(rest[(showN*n+i)%rest.length]);
  const base=Math.floor(90/Math.max(1,out.length));let left=90-base*out.length;
  return out.map(x=>({screen:x.screen,seconds:base+(left-->0?1:0)}));
}

  const k=Math.min(1,(performance.now()-dwellStart)/dwell);
  const d=$('dt'+idx);if(d)d.style.width=(k*100)+'%';

async function fetchPayload(){

    const r=await fetch(API+'?t='+encodeURIComponent(TOKEN),{cache:'no-store',signal:ctl.signal,referrerPolicy:'no-referrer'});
    clearTimeout(to);
    if(r.status===404){P=null;lsDel(LS_P);showBoot();return;}   // screen removed or switched off
    if(!r.ok)return;                                              // keep the last payload
    const p=await r.json();
    if(!p||typeof p!=='object'||!p.unit)return;
    P=p;lsSet(LS_P,JSON.stringify({t:TOKEN,p}));
    apply();
    if(idx<0)startCycle();
  }catch(_){/* offline: keep the last payload on screen */}
  finally{inflight=false;}
}

    if(t!==lsGet(LS_T))lsDel(LS_P);

    u.searchParams.delete('t');try{history.replaceState(null,'',u.pathname+u.search+u.hash);}catch(_){}
  }else TOKEN=lsGet(LS_T);
  try{const o=JSON.parse(lsGet(LS_P)||'null');if(o&&o.t===TOKEN&&o.p&&o.p.unit)P=o.p;}catch(_){}
  if(P){apply();startCycle();}else showBoot();
  fetchPayload();
  setInterval(fetchPayload,REFRESH_MS);
  setInterval(tick,200);
  setInterval(clock,1000);clock();
  // a player that hides the page during its video and shows it again: start a fresh cycle
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){fetchPayload();if(P)startCycle();}});
}

/* ---------- festive layer (theme christmas only) ---------- */
(function lights(){
  const C4=['#ff5a5f','#f6c453','#3ecf7a','#8fd3ff'];const sw=16,w=1600/sw;let wire='',bulbs='',k=0;
  for(let s=0;s<sw;s++){const x0=s*w,x1=x0+w,cx=x0+w/2,cy=16;wire+=`M${x0} 2Q${cx} ${cy} ${x1} 2`;
    [.3,.7].forEach(t=>{const x=(1-t)*(1-t)*x0+2*(1-t)*t*cx+t*t*x1,y=(1-t)*(1-t)*2+2*(1-t)*t*cy+t*t*2;const c=C4[k%4],d=((k*0.37)%2.6).toFixed(2);
      bulbs+=`<circle class="halo" cx="${x.toFixed(1)}" cy="${(y+6).toFixed(1)}" r="6" fill="${c}" style="animation-delay:${d}s"/><rect x="${(x-1.6).toFixed(1)}" y="${y.toFixed(1)}" width="3.2" height="2.6" rx=".6" fill="#2b3a52"/><ellipse class="bulb" cx="${x.toFixed(1)}" cy="${(y+6).toFixed(1)}" rx="2.6" ry="3.8" fill="${c}" style="animation-delay:${d}s"/>`;k++;});}
  $('lights').innerHTML=`<path d="${wire}" fill="none" stroke="#1d2a40" stroke-width="1.4"/>${bulbs}`;
})();
(function snow(){
  const cv=$('snow'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1,fl=[];
  function fit(){const r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;if(!W)return;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!fl.length)for(let i=0;i<45;i++)fl.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.00025+Math.random()*.0005,p:Math.random()*6.28});}
  function draw(t){ctx.clearRect(0,0,W,H);fl.forEach(f=>{if(!RM){f.y+=f.v;if(f.y>1.02){f.y=-.02;f.x=Math.random();}}
    const x=(f.x+Math.sin(t/2600+f.p)*.006)*W,y=f.y*H;ctx.beginPath();ctx.arc(x,y,f.r*W/1150,0,6.283);ctx.fillStyle='rgba(255,255,255,'+(0.05+f.r*.04)+')';ctx.fill();});}
  function frame(t){if($('tv').classList.contains('cup')&&!document.hidden){if(!W)fit();draw(t);}if(!RM)requestAnimationFrame(frame);}
  window.addEventListener('resize',()=>{W=0;fit();if(RM)draw(0);barKey='';bar();});
  fit();requestAnimationFrame(frame);if(RM)draw(0);
})();
boot();
</script>
